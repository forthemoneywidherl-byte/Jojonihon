<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOJO — Kotoba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
    }
    :root {
      --navy: #12396b;
      --blue: #2f7ff0;
      --blue-light: #eef6ff;
      --muted: #91a0b3;
      --pink: #e95775;
      --green: #16b86a;
      --purple: #7d45ed;
      --yellow: #ffd52f;
      --bg: #fbf9ff;
      --red: #f05b78;
      --yellow: #ffc83d;
    }
    body {
      background:
        radial-gradient(circle at 8% 18%, rgba(125,69,237,.09), transparent 24%),
        radial-gradient(circle at 92% 34%, rgba(240,91,120,.08), transparent 22%),
        radial-gradient(circle at 12% 78%, rgba(22,184,106,.07), transparent 23%),
        var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    /* HEADER */
    header {
      height: 82px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }
    .logo {
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--navy);
    }
    .logo .pink {
      color: var(--pink);
    }
    .bell {
      border: 0;
      background: transparent;
      font-size: 36px;
      cursor: pointer;
      line-height: 1;
    }
    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px 120px;
    }
    /* WELCOME */
    .welcome {
      min-height: 124px;
      border-radius: 28px;
      background: linear-gradient(110deg, #eee7ff 0%, #e7f2ff 48%, #fff0f3 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 16px 24px 16px 30px;
      margin-bottom: 14px;
    }
    .welcome-text h1 {
      font-size: 35px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .welcome-text p {
      color: #7289a4;
      font-size: 20px;
    }
    .kitsu {
      width: 195px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 88px;
      filter: drop-shadow(0 5px 4px rgba(0,0,0,.08));
    }
    .kitsu img {
      width: 100%;
      height: 158px;
      object-fit: contain;
      display: block;
    }
    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    .stat {
      height: 98px;
      background: linear-gradient(135deg, #fff1f3, #ffffff 78%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 14px 22px;
      box-shadow: 0 8px 22px rgba(30, 70, 120, .07);
    }
    .stat:nth-child(2) {
      background: linear-gradient(135deg, #fff7d9, #ffffff 78%);
    }
    .stat-icon {
      font-size: 46px;
      width: 72px;
      text-align: center;
      margin-right: 12px;
    }
    .stat-label {
      color: #95a2b2;
      font-size: 19px;
      margin-bottom: 4px;
    }
    .stat-value {
      color: var(--navy);
      font-size: 28px;
      font-weight: 700;
    }
    /* START */
    .start-btn {
      width: 100%;
      height: 74px;
      border: 0;
      border-radius: 27px;
      background: linear-gradient(100deg, #7d45ed 0%, #2f7ff0 52%, #16b86a 100%);
      color: white;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(47, 127, 240, .25);
      margin-bottom: 20px;
      transition: transform .15s, box-shadow .15s;
    }
    .start-btn:active {
      transform: scale(.98);
    }
    /* MATERIAL */
    .section-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .materials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .material {
      text-decoration: none;
      color: var(--navy);
      background: white;
      min-height: 180px;
      border-radius: 25px;
      padding: 16px 8px 12px;
      text-align: center;
      box-shadow: 0 7px 20px rgba(30, 70, 120, .07);
      transition: transform .15s;
    }
    .material:nth-child(1) {
      background: linear-gradient(155deg, #d9fbea 0%, #f3fff8 100%);
      border: 1px solid #b8f0d2;
    }
    .material:nth-child(2) {
      background: linear-gradient(155deg, #dcecff 0%, #f4f9ff 100%);
      border: 1px solid #c3ddff;
    }
    .material:nth-child(3) {
      background: linear-gradient(155deg, #ffe0e8 0%, #fff5f7 100%);
      border: 1px solid #ffc3d0;
    }
    .material:active {
      transform: scale(.97);
    }
    .material-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 9px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 47px;
    }
    .green {
      background: #ddfaed;
    }
    .blue {
      background: #e4f0ff;
    }
    .purple {
      background: #f0e7ff;
    }
    .material:nth-child(1) .material-icon {
      background: #ddfaed;
    }
    .material:nth-child(2) .material-icon {
      background: #e4f0ff;
    }
    .material:nth-child(3) .material-icon {
      background: #ffe5eb;
    }
    .material h3 {
      font-size: 23px;
      margin-bottom: 5px;
    }
    .material p {
      color: #a0a9b5;
      font-size: 14px;
      line-height: 1.2;
    }
    /* QUOTE */
    .quote {
      min-height: 120px;
      border-radius: 27px;
      background: linear-gradient(105deg, #f0e8ff 0%, #e8f4ff 48%, #fff4d8 100%);
      display: flex;
      align-items: center;
      padding: 14px 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .quote-kitsu {
      width: 120px;
      font-size: 68px;
      text-align: center;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote-kitsu img {
      width: 100%;
      max-width: 112px;
      height: 112px;
      object-fit: contain;
      display: block;
    }
    .quote-text {
      font-size: 22px;
      line-height: 1.35;
    }
    .quote-author {
      color: #7187a1;
      font-size: 19px;
      margin-top: 6px;
    }
    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(620px, 100%);
      height: 82px;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #edf0f5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 100;
      box-shadow: 0 -7px 20px rgba(20, 50, 90, .06);
    }
    .nav-item {
      text-decoration: none;
      color: #a1acba;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 16px;
      font-weight: 600;
    }
    .nav-icon {
      font-size: 34px;
      line-height: 1;
    }
    .nav-active {
      color: var(--blue);
    }
    /* MOBILE */
    @media (max-width: 500px) {
      .app {
        max-width: 100%;
      }
      header {
        height: 80px;
        padding: 0 24px;
      }
      .logo {
        font-size: 42px;
      }
      .bell {
        font-size: 31px;
      }
      main {
        padding: 16px 24px 88px;
      }
      .welcome {
        min-height: 124px;

      }
      .welcome-text h1 {
        font-size: 28px;
      }
      .welcome-text p {
        font-size: 17px;
      }
      .kitsu {
        width: 150px;

      }
      .kitsu img {
        height: 145px;
      }
      .stat {
        height: 96px;
        padding: 14px 17px;
      }
      .stat-icon {
        font-size: 39px;
        width: 53px;
        margin-right: 6px;
      }
      .stat-label {
        font-size: 17px;
      }
      .stat-value {
        font-size: 24px;
      }
      .start-btn {
        height: 72px;
        font-size: 26px;
        border-radius: 25px;
      }
      .section-title {
        font-size: 27px;
      }
      .materials {
        gap: 10px;
      }
      .material {
        min-height: 175px;
        border-radius: 22px;
        padding: 14px 5px;
      }
      .material-icon {
        width: 70px;
        height: 70px;
        font-size: 39px;
        border-radius: 20px;
      }
      .material h3 {
        font-size: 20px;
      }
      .material p {
        font-size: 13px;
      }
      .quote {
        min-height: 118px;
        padding: 12px;
      }
      .quote-kitsu {
        width: 102px;
        font-size: 54px;
      }
      .quote-text {
        font-size: 17px;
      }
      .quote-author {
        font-size: 14px;
      }
      .bottom-nav {
        height: 72px;
      }
      .nav-icon {
        font-size: 27px;
      }
      .nav-item {
        font-size: 13px;
      }
    }
    @media (max-width: 360px) {
      main {
        padding-left: 18px;
        padding-right: 18px;
      }
      .welcome-text h1 {
        font-size: 25px;
      }
      .welcome-text p {
        font-size: 16px;
      }
      .kitsu {
        font-size: 67px;
      }
      .stat-label {
        font-size: 14px;
      }
      .stat-value {
        font-size: 23px;
      }
      .material h3 {
        font-size: 17px;
      }
      .material p {
        font-size: 12px;
      }
    }

    .welcome::before,
    .welcome::after {
      content: none !important;
      display: none !important;
    }
    @media (max-width: 500px) {
      .welcome {
        background-position: center 48% !important;
      }
    }
    /* Rounded sakura welcome banner, matching the reference */
    .welcome {
      border-radius: 30px !important;
      overflow: hidden !important;
      isolation: isolate;
    }
    @media (max-width: 500px) {
      .welcome {
        border-radius: 24px !important;
      }
    }
  

    .page-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 7px 0 18px;
    }

    .back-link {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #fff;
      color: #2f7ff0;
      text-decoration: none;
      font-size: 27px;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(44,71,130,.09);
    }

    .page-heading h1 {
      font-size: 29px;
      line-height: 1.1;
      font-weight: 900;
      color: #172b67;
    }

    .page-heading p {
      margin-top: 4px;
      color: #71829d;
      font-size: 14px;
      font-weight: 800;
    }

    .kotoba-intro {
      padding: 18px 19px;
      border-radius: 23px;
      background: linear-gradient(120deg, #e8e1ff, #e4f1ff 58%, #ffe9ef);
      margin-bottom: 18px;
      box-shadow: 0 6px 16px rgba(44,71,130,.07);
    }

    .kotoba-intro strong {
      display: block;
      font-size: 20px;
      font-weight: 900;
      color: #263b79;
      margin-bottom: 5px;
    }

    .kotoba-intro span {
      display: block;
      color: #607493;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .level-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .level-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 88px;
      padding: 13px 16px;
      border-radius: 22px;
      text-decoration: none;
      color: #172b67;
      box-shadow: 0 6px 15px rgba(44,71,130,.09);
      border: 1px solid rgba(255,255,255,.85);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .level-card:active {
      transform: scale(.98);
    }

    .level-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      flex: 0 0 58px;
      font-size: 25px;
      font-weight: 900;
      color: #fff;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.07);
    }

    .level-copy {
      flex: 1;
      min-width: 0;
    }

    .level-copy h2 {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .level-copy p {
      color: #657794;
      font-size: 13px;
      font-weight: 800;
    }

    .level-arrow {
      color: #526b93;
      font-size: 30px;
      font-weight: 900;
      padding-left: 4px;
    }

    .n5 { background: linear-gradient(120deg,#dff8e9,#effff4); }
    .n5 .level-icon { background: #21b96b; }
    .n4 { background: linear-gradient(120deg,#dcecff,#eef6ff); }
    .n4 .level-icon { background: #3289ed; }
    .n3 { background: linear-gradient(120deg,#eee4ff,#f7f1ff); }
    .n3 .level-icon { background: #8654e8; }
    .n2 { background: linear-gradient(120deg,#ffe3ea,#fff1f4); }
    .n2 .level-icon { background: #eb5c7b; }
    .n1 { background: linear-gradient(120deg,#fff0c9,#fff9e9); }
    .n1 .level-icon { background: #e9ae20; }

    @media (max-width: 500px) {
      main { padding: 12px 18px 86px; }
      header { height: 62px; padding: 0 20px; }
      .logo { font-size: 43px; }
      .page-heading h1 { font-size: 26px; }
      .level-card { min-height: 80px; padding: 11px 13px; }
      .level-icon { width: 53px; height: 53px; flex-basis: 53px; }
      .level-copy h2 { font-size: 19px; }
    }

    .kotoba-level-art {
      position: relative;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      line-height: 0;
      align-self: center;
    }
    .kotoba-level-art > img {
      display: block;
      width: 100%;
      height: auto;
    }
    .kotoba-level-art .level-hit {
      position: absolute;
      left: 1.5%;
      width: 97%;
      height: 19.4%;
      border-radius: 24px;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .kotoba-level-art .level-hit:active {
      background: rgba(255,255,255,.12);
      outline: 2px solid rgba(255,255,255,.8);
    }
    .kotoba-level-art .n5 { top: 0%; }
    .kotoba-level-art .n4 { top: 20%; }
    .kotoba-level-art .n3 { top: 40%; }
    .kotoba-level-art .n2 { top: 60%; }
    .kotoba-level-art .n1 { top: 80%; }
    @media (max-width: 500px) {
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
