<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOJO — Kosakata Hari 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#edf6ff,#f5f3ff);font-family:Nunito,sans-serif;color:#172d59;min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{height:68px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center}
.back{border:0;background:transparent;color:#1c356e;font-size:34px;text-decoration:none;line-height:1}
header h1{font-size:22px;margin:0;font-weight:1000}
.counter{margin:12px 0 18px;background:white;border-radius:18px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 16px #243d6810}
.count{font-size:17px;font-weight:1000;white-space:nowrap}
.track{height:13px;background:#e4eaf4;border-radius:20px;overflow:hidden;flex:1}
.fill{height:100%;width:5%;background:#55c66a;border-radius:20px;transition:width .25s}
.sound{border:0;background:transparent;font-size:27px;cursor:pointer}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 30px #314c7810;padding:28px 18px 20px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:470px}
.jp{font-family:'M PLUS Rounded 1c',sans-serif;font-size:clamp(35px,9vw,54px);font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.romaji{font-family:Nunito,sans-serif;font-size:22px;font-weight:900;color:#8190aa;margin-top:8px}
.illustration{height:150px;width:100%;display:grid;place-items:center;background:linear-gradient(180deg,#f7fbff,#edf6ff);border-radius:22px;margin:20px 0;font-size:90px}
.meaning{width:100%;padding:20px 12px;border-radius:20px;background:#e8f2ff;font-size:22px;font-weight:900;color:#203a6c}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.action{border:0;border-radius:20px;padding:17px 8px;font:900 16px Nunito;cursor:pointer;min-height:76px;box-shadow:inset 0 -4px #0000000d}
.miss{background:#ffe3e8;color:#d94d64} .know{background:#e2f8d9;color:#32964a}
.action span{display:block;font-size:23px;margin-bottom:2px}
.finish{display:none;text-align:center;background:white;padding:30px 20px;border-radius:26px;box-shadow:0 8px 24px #263f6c12;margin-top:20px}
.finish h2{font-size:27px;margin:0 0 10px} .finish p{color:#71829d;font-weight:800}
.again{background:#3988ee;color:white;border:0;border-radius:15px;padding:13px 22px;font:900 16px Nunito}
@media(max-height:760px){.card{min-height:410px;padding:18px}.illustration{height:115px;font-size:76px;margin:12px 0}.meaning{padding:15px}}

.app { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
.bottom-nav {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(620px, 100%); height: 82px; background: rgba(255,255,255,.98);
  border-top: 1px solid #edf0f5; display: grid; grid-template-columns: repeat(4,1fr);
  z-index: 100; box-shadow: 0 -7px 20px rgba(20,50,90,.06);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item { text-decoration:none; color:#a1acba; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; font-size:12px; font-weight:800; }
.nav-asset { display:block; width:100%; max-width:112px; height:58px; object-fit:contain; object-position:center; }
.nav-active { color:#a1acba; }


/* Compact layout for the typing session on phone screens */
body.typing-active .app{
  min-height:0;
  height:auto;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
body.typing-active #typingStage{
  flex:0 0 auto;
  margin:8px 0 0;
  padding:12px 14px 14px;
}
body.typing-active #typingStage .typing-kicker{padding:4px 8px;font-size:11px}
body.typing-active #typingStage .typing-prompt{
  font-size:clamp(22px,6vw,30px);
  margin:8px 0 5px;
  line-height:1.2;
}
body.typing-active #typingStage .typing-hint{
  margin:5px 0 8px;
  font-size:14px;
}
body.typing-active #typingStage .typing-image{
  height:88px;
  margin:8px 0 10px;
  font-size:58px;
}
body.typing-active .typing-dock{
  padding:8px 10px 9px;
  border-radius:15px 15px 0 0;
}
body.typing-active .typing-dock input{
  min-height:44px;
  padding:9px 12px;
  font-size:15px;
}
body.typing-active .typing-dock button{
  min-height:40px;
  margin-top:6px;
  font-size:14px;
}
body.typing-active .typing-dock .typing-feedback{
  margin-top:6px;
  padding:7px 9px;
  font-size:13px;
}
@media(max-height:720px){
  body.typing-active #typingStage .typing-image{height:76px;font-size:50px}
  body.typing-active #typingStage{padding:10px 12px}
  body.typing-active .typing-dock{bottom:calc(82px + env(safe-area-inset-bottom))}
}


/* Full-screen learning canvas: use the available phone height instead of leaving a large gap */
@supports (height: 100dvh){
  body.typing-active .app{
    height:calc(100dvh - 82px - env(safe-area-inset-bottom));
    min-height:0;
    max-height:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:0;
  }
}
body.typing-active header,
body.typing-active #counter{display:none!important}
body.typing-active #typingStage{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  margin:8px 0 0;
  padding:18px 18px 20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:stretch;
  border-radius:22px;
  overflow:hidden;
}
body.typing-active #typingStage .typing-kicker{align-self:flex-start}
body.typing-active #typingStage #typingCount{margin:8px 0!important;font-size:16px}
body.typing-active #typingStage .typing-prompt{
  font-size:clamp(26px,7vw,38px);
  line-height:1.2;
  margin:8px 0;
}
body.typing-active #typingStage .typing-image{
  flex:1 1 auto;
  min-height:150px;
  max-height: min(34vh,300px);
  width:100%;
  margin:10px 0;
  display:grid;
  place-items:center;
  font-size:clamp(76px,18vw,120px);
  border-radius:20px;
}
body.typing-active #typingStage .typing-hint{
  margin:10px 0 4px;
  font-size:clamp(14px,3.8vw,17px);
}
body.typing-active .typing-dock{
  bottom:calc(82px + env(safe-area-inset-bottom));
  padding:12px 14px 14px;
  border-radius:18px 18px 0 0;
}
body.typing-active .typing-dock input{min-height:52px;font-size:16px}
body.typing-active .typing-dock button{min-height:48px;font-size:15px}
body.typing-active{overflow:hidden}
@media(max-height:700px){
  body.typing-active #typingStage{padding:12px}
  body.typing-active #typingStage .typing-image{min-height:105px;max-height:26vh}
  body.typing-active .typing-dock{padding:8px 10px}
  body.typing-active .typing-dock input{min-height:42px}
  body.typing-active .typing-dock button{min-height:40px}
}


/* Match the original flashcard scale: larger Japanese prompt and a flexible illustration panel */
body.typing-active #typingStage{
  justify-content:flex-start;
  gap:10px;
  padding:20px 18px 24px;
}
body.typing-active #typingStage .typing-kicker{font-size:13px;padding:6px 11px}
body.typing-active #typingStage #typingCount{font-size:19px!important;margin:8px 0 2px!important}
body.typing-active #typingStage .typing-prompt{
  font-size:clamp(38px,10vw,58px);
  font-weight:900;
  line-height:1.25;
  margin:4px 0 10px;
}
body.typing-active #typingStage .typing-image{
  flex:1 1 0;
  min-height:220px;
  max-height:none;
  width:100%;
  margin:8px 0 10px;
  font-size:clamp(110px,25vw,160px);
  border-radius:24px;
}
body.typing-active #typingStage .typing-hint{
  flex:0 0 auto;
  margin:8px 0 4px;
  font-size:clamp(16px,4.2vw,20px);
}
@media(max-height:760px){
  body.typing-active #typingStage{gap:7px;padding:14px 14px 18px}
  body.typing-active #typingStage .typing-image{
    min-height:170px;
    font-size:clamp(96px,22vw,140px);
  }
}


/* Sesi 2 visual layout based on the user's reference */
body.typing-active .app{
  width:100%;max-width:560px;height:calc(100dvh - 82px - env(safe-area-inset-bottom));
  min-height:0;padding:10px 18px 0;display:flex;flex-direction:column;gap:0;
}
body.typing-active header,body.typing-active #counter{display:none!important}
body.typing-active #typingStage{
  display:flex;flex:1 1 auto;min-height:0;overflow:hidden;
  margin:0;padding:12px 14px 14px;border-radius:30px;
  background:linear-gradient(160deg,#f3faff 0%,#fff 45%,#f5faff 100%);
  border:1px solid #d9ebfb;box-shadow:0 8px 24px #3275b51a;
  flex-direction:column;gap:12px;
}
.typing-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.typing-kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:30px;background:#e7f0ff;color:#173b80;font-size:13px;font-weight:1000;text-transform:none}
.typing-key-icon{font-size:18px}
.typing-segments{display:flex;gap:5px;padding:7px 9px;border-radius:30px;background:#fff;box-shadow:0 2px 10px #1b4a8010}
.typing-segments i{display:block;width:22px;height:14px;border-radius:8px;background:#dce5f2}
.typing-segments i.active{background:#19a8e8}
.typing-count{align-self:center;padding:7px 18px;border-radius:30px;background:#eaf2ff;color:#1b2f59;font-size:17px;font-weight:800}
.typing-inner-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:12px 12px 14px;border:1px solid #d9eaff;border-radius:26px;background:#fff;box-shadow:0 4px 16px #3977b514}
body.typing-active #typingStage .typing-prompt{font-family:'M PLUS Rounded 1c',sans-serif;font-size:clamp(34px,8vw,52px);font-weight:900;line-height:1.25;text-align:center;margin:0;color:#172d59;overflow-wrap:anywhere}
.typing-romaji-row{display:flex;align-items:center;justify-content:center;gap:10px}
.typing-romaji{padding:7px 18px;border-radius:25px;background:#eaf2ff;color:#1b2f59;font-size:17px;font-weight:900}
.typing-sound{border:0;border-radius:50px;width:48px;height:42px;background:#1689ed;color:white;font-size:20px;font-weight:900}
body.typing-active #typingStage .typing-image{flex:1 1 auto;width:100%;min-height:120px;max-height:none;margin:8px 0;background:linear-gradient(180deg,#f3faff,#e8f4ff);border-radius:22px;display:grid;place-items:center;font-size:clamp(90px,23vw,145px)}
.typing-instruction{width:100%;padding:10px 12px;text-align:center;background:#eaf2ff;color:#1b2f59;border-radius:24px;font-size:clamp(14px,3.8vw,18px);font-weight:800}
body.typing-active .typing-dock{position:relative;left:auto;bottom:auto;transform:none;width:100%;flex:0 0 auto;margin:10px 0 12px;padding:0;background:transparent;border:0;box-shadow:none;border-radius:0}
.typing-input-wrap{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 14px;border:2px solid #8fc8f5;border-radius:22px;background:white;box-shadow:0 3px 10px #267bc21a}
.typing-pencil{font-size:28px;color:#173b80}
.typing-dock input{min-width:0;flex:1;width:100%;min-height:50px;border:0!important;outline:none!important;box-shadow:none!important;padding:8px 0!important;font:800 16px Nunito,Arial,sans-serif;background:transparent}
body.typing-active .typing-dock #typingCheck,body.typing-active .typing-dock #typingNext{width:100%;min-height:56px;margin-top:10px;border-radius:28px;background:#1762e8;color:#fff;font:1000 19px Nunito,Arial,sans-serif;box-shadow:inset 0 -3px #0648b9}
body.typing-active .typing-dock #typingNext{display:none}
body.typing-active .typing-dock .typing-feedback{margin-top:7px;padding:8px 12px;border-radius:14px;font-size:14px}
body.typing-active .bottom-nav{height:82px}
body.typing-active{padding-bottom:0;overflow:hidden}
@media(max-height:720px){
 body.typing-active .app{padding-top:6px}
 body.typing-active #typingStage{gap:7px;padding:8px 10px}
 .typing-kicker{padding:5px 9px;font-size:11px}
 .typing-count{font-size:14px;padding:5px 13px}
 .typing-inner-card{padding:8px}
 body.typing-active #typingStage .typing-image{min-height:80px}
 .typing-instruction{padding:7px;font-size:13px}
 body.typing-active .typing-dock{margin:6px 0 8px}
 .typing-input-wrap{min-height:46px}
 .typing-dock input{min-height:42px}
 body.typing-active .typing-dock #typingCheck{min-height:46px;margin-top:7px}
}


/* Fix collisions: keep romaji/audio on one line and keep illustration inside its own area */
body.typing-active #typingStage{
  gap:10px;
  overflow-y:auto;
  overflow-x:hidden;
}
body.typing-active #typingStage .typing-inner-card{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  gap:12px;
  min-height:0;
  overflow:hidden;
  padding:clamp(12px,3vw,20px);
}
body.typing-active #typingStage .typing-prompt{
  flex:0 0 auto;
  width:100%;
  overflow-wrap:anywhere;
  word-break:normal;
  text-align:center;
  padding:0 4px;
}
body.typing-active #typingStage .typing-romaji-row{
  flex:0 0 auto;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:12px;
  width:100%;
  min-width:0;
}
body.typing-active #typingStage .typing-romaji{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:auto;
  max-width:calc(100% - 64px);
  min-width:0;
  white-space:normal;
  overflow-wrap:anywhere;
  text-align:center;
  line-height:1.3;
  padding:8px 18px;
}
body.typing-active #typingStage .typing-sound{
  flex:0 0 48px;
  width:48px;
  height:48px;
  min-width:48px;
  display:grid;
  place-items:center;
  border-radius:50%;
  padding:0;
  line-height:1;
}
body.typing-active #typingStage .typing-image{
  flex:1 1 180px;
  min-height:150px;
  max-height:none;
  width:100%;
  margin:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  font-size:clamp(76px,19vw,128px);
}
body.typing-active #typingStage .typing-instruction{
  position:relative;
  z-index:1;
  flex:0 0 auto;
  width:100%;
  margin:0;
  line-height:1.35;
  white-space:normal;
  overflow-wrap:anywhere;
}
@media(max-height:760px){
  body.typing-active #typingStage .typing-inner-card{gap:8px}
  body.typing-active #typingStage .typing-image{flex-basis:120px;min-height:110px}
  body.typing-active #typingStage .typing-sound{flex-basis:42px;width:42px;height:42px;min-width:42px}
}


/* Sesi 1 completion: centered, larger, full-height panel with clear buttons */
body.finish-active .app{
  min-height:calc(100dvh - 82px - env(safe-area-inset-bottom));
  height:calc(100dvh - 82px - env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
body.finish-active #counter{flex:0 0 auto}
body.finish-active #finish{
  display:flex!important;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  margin:12px 0 14px;
  padding:22px 18px;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid #e3ebf7;
  border-radius:28px;
  box-shadow:0 8px 28px #263f6c12;
}
.finish-content{width:100%;max-width:520px;margin:auto}
.finish-emoji{font-size:clamp(54px,13vw,76px);line-height:1.1;margin-bottom:10px}
.finish h2{font-size:clamp(30px,7vw,40px);line-height:1.2;margin:0 0 14px}
.finish p{font-size:clamp(16px,4.2vw,20px);line-height:1.55;margin:0 auto 26px;max-width:440px}
.finish-actions{display:flex;flex-direction:column;gap:12px;width:100%}
.finish-actions button{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:62px;padding:14px 18px;
  border:0;border-radius:18px;font:900 clamp(16px,4.3vw,19px) Nunito,Arial,sans-serif;
  line-height:1.25;white-space:normal;cursor:pointer;
}
.finish-primary{background:#3156d8;color:#fff;box-shadow:inset 0 -4px #2446b8}
.finish-secondary{background:#eaf1ff;color:#3156d8;border:2px solid #d4e2ff!important}
.finish-actions button:active{transform:scale(.99)}
@media(max-height:700px){
 body.finish-active .app{height:calc(100dvh - 82px - env(safe-area-inset-bottom))}
 body.finish-active #finish{padding:14px;margin:8px 0}
 .finish-emoji{font-size:48px;margin-bottom:5px}
 .finish h2{font-size:28px}
 .finish p{margin-bottom:16px}
 .finish-actions button{min-height:52px}
}


/* Full, mascot-led end screen: use the available screen height without empty gaps */
body.typing-active .app{
  height:calc(100dvh - 82px - env(safe-area-inset-bottom));
  min-height:0;
  display:flex;
  flex-direction:column;
  padding-top:8px;
}
body.typing-active #typingStage{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
body.typing-active #typingStage:has(.result-top){
  justify-content:space-between;
  gap:8px;
  padding:14px 16px 16px;
  overflow-y:auto;
  background:linear-gradient(160deg,#f2f8ff 0%,#fff 48%,#f1f7ff 100%);
  border:1px solid #dce9f8;
  border-radius:26px;
  box-shadow:0 8px 24px #234a8012;
}
.result-top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.result-confetti{font-size:24px;color:#2c9fe6;letter-spacing:5px}
.result-mascot-wrap{
  position:relative;
  flex:1 1 auto;
  min-height:120px;
  max-height:clamp(130px,24vh,210px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.result-mascot-aura{
  position:absolute;width:clamp(116px,34vw,174px);height:clamp(116px,34vw,174px);
  border-radius:50%;background:linear-gradient(145deg,#e2f2ff,#f8eaff);
  box-shadow:0 6px 20px #76a9df22;
}
.result-mascot{position:relative;z-index:1;font-size:clamp(78px,22vw,126px);line-height:1.1;filter:drop-shadow(0 5px 2px #1e46701a)}
.result-speech{
  position:relative;z-index:2;padding:7px 14px;border-radius:18px;
  background:#e8f1ff;color:#24458a;font-weight:900;font-size:13px;text-align:center;
  box-shadow:0 3px 10px #234a8010;
}

.result-subtitle{flex:0 0 auto;text-align:center;color:#778195;font-size:14px;font-weight:700;margin-top:-4px}
.result-score-card{
  flex:0 0 auto;width:100%;padding:10px 14px;text-align:center;
  border-radius:18px;background:#fff;border:1px solid #e1eaf7;
}
.result-score-label{font-size:11px;letter-spacing:1.4px;font-weight:1000;color:#72809a}
.result-score{font-size:clamp(34px,8vw,46px);font-weight:1000;color:#3156d8;line-height:1.1;margin:3px 0}
.result-score small{font-size:19px;color:#7d8aa0}
.result-score-detail{font-size:13px;color:#778195;font-weight:800}
.result-reward{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:9px 14px;border-radius:16px;background:#fff7dc;border:1px solid #f7e6a8;
}
.result-coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffc83d;color:#fff;font-size:21px}
.result-reward strong{display:block;color:#d18b00;font-size:22px;line-height:1.1}
.result-reward small{display:block;color:#8c7950;font-size:11px;font-weight:700}
.result-total{text-align:center;color:#78849a;font-size:13px;font-weight:700}
.result-total strong{color:#3156d8}
.result-actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.result-actions button{
  width:100%;min-height:46px;border:0;border-radius:14px;background:#3156d8;color:#fff;
  font:900 15px Nunito,Arial,sans-serif;padding:10px 14px;
}

let index=0, known=0, missed=[];
function render(){
 const w=words[index];
 document.getElementById('count').textContent=(index+1)+' / '+words.length;
 document.getElementById('fill').style.width=((index+1)/words.length*100)+'%';
 document.getElementById('jp').textContent=w.jp;
 document.getElementById('romaji').textContent=w.romaji;
 document.getElementById("illustration").innerHTML='<img src="'+w.asset+'" alt="Ilustrasi '+w.jp+'">';
 document.getElementById('meaning').textContent=w.id;
}
function speak(){
 const w=words[index]; if(!('speechSynthesis' in window)){alert('Audio tidak didukung browser ini.');return;}
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w.jp.replace(/[（）()]/g,''));u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u);
}
function answer(isKnown){
 if(isKnown) known++; else missed.push(words[index]);
 index++;
 if(index<words.length) render();
 else {
  document.getElementById('card').style.display='none';
  document.getElementById('actions').style.display='none';
  document.getElementById('finish').style.display='flex';
  document.body.classList.add('finish-active');
  document.getElementById('result').textContent=known+' dari '+words.length+' kosakata ditandai sudah tahu. '+missed.length+' kosakata perlu diulang.';
 }
}
function restart(){
 index=0;known=0;missed=[];
 document.getElementById('card').style.display='flex';
 document.getElementById('actions').style.display='grid';
 document.getElementById('finish').style.display='none';document.body.classList.remove('finish-active');render();
}
render();
</script>

<script id="typing-flashcard-script">
let typingIndex=0, typingCorrect=0, typingAnswered=false;

function normalizeAnswer(value){
  return (value||"").trim().toLocaleLowerCase("id-ID").replace(/\s+/g," ");
}
function startTypingFlashcards(){
  document.getElementById("finish").style.display="none";
  document.body.classList.remove("finish-active");
  document.getElementById("card").style.display="none";
  document.getElementById("actions").style.display="none";
  document.getElementById("counter").style.display="none";
  document.getElementById("typingStage").style.display="block";
  document.getElementById("typingDock").style.display="block";
  document.body.classList.add("typing-active");
  typingIndex=0;typingCorrect=0;renderTypingCard();
  window.scrollTo({top:0,behavior:"smooth"});
}
function speakTyping(){const item=words[typingIndex];if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(item.jp.replace(/[（）()]/g,""));utterance.lang="ja-JP";utterance.rate=.82;speechSynthesis.speak(utterance);}
function renderTypingCard(){
  const item=words[typingIndex];
  document.getElementById("typingCount").textContent="Kosakata "+(typingIndex+1)+" / "+words.length;
  document.getElementById("typingPrompt").textContent=item.jp;
  document.getElementById("typingRomaji").textContent=item.romaji;
  document.getElementById("typingImage").innerHTML='<img src="'+item.asset+'" alt="Ilustrasi '+item.jp+'">';
  const segs=document.querySelectorAll("#typingSegments i");
  segs.forEach((seg,i)=>seg.classList.toggle("active",i<Math.ceil((typingIndex+1)/words.length*5)));
  const input=document.getElementById("typingAnswer");
  input.value="";input.disabled=false;
  document.getElementById("typingFeedback").className="typing-feedback";
  document.getElementById("typingFeedback").textContent="";
  document.getElementById("typingCheck").style.display="block";
  document.getElementById("typingCheck").disabled=false;
  document.getElementById("typingNext").style.display="none";
  typingAnswered=false;
}
function checkTypingAnswer(){
  if(typingAnswered)return;
  const item=words[typingIndex];
  const typed=normalizeAnswer(document.getElementById("typingAnswer").value);
  const feedback=document.getElementById("typingFeedback");
  if(!typed){
    feedback.className="typing-feedback bad";
    feedback.textContent="Ketik arti kosakata terlebih dahulu.";
    return;
  }
  typingAnswered=true;
  document.getElementById("typingAnswer").disabled=true;
  document.getElementById("typingCheck").disabled=true;
  document.getElementById("typingNext").style.display="block";

  // Accept the Indonesian alternatives separated by "/" as valid answers.
  const accepted=item.id.split("/").map(normalizeAnswer);
  const isCorrect=accepted.includes(typed);
  if(isCorrect){
    typingCorrect++;
    feedback.className="typing-feedback good";
    feedback.textContent="✓ Benar! "+item.id;
  }else{
    feedback.className="typing-feedback bad";
    feedback.textContent="Belum tepat. Jawaban yang benar: "+item.id;
  }
  document.getElementById("typingNext").textContent=
    typingIndex===words.length-1?"Lihat nilai akhir →":"Kosakata berikutnya →";
}
function nextTypingCard(){
  if(!typingAnswered)return;
  typingIndex++;
  if(typingIndex<words.length)renderTypingCard();
  else showTypingResult();
}
function awardTypingXP(score){
  // XP mengikuti nilai akhir. Penyelesaian latihan juga mencatat streak hari ini.
  const earned=Math.max(0, Math.round(Number(score)||0));
  const todayDate=new Date();
  const today=[todayDate.getFullYear(),String(todayDate.getMonth()+1).padStart(2,"0"),String(todayDate.getDate()).padStart(2,"0")].join("-");
  const shiftDate=(key,amount)=>{
    const parts=key.split("-").map(Number);
    const d=new Date(parts[0],parts[1]-1,parts[2]);
    d.setDate(d.getDate()+amount);
    return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
  };
  let total=Number(localStorage.getItem("jojoXP")||localStorage.getItem("kitsumiXP")||0);
  let streak=Math.max(0,Number(localStorage.getItem("jojoStreak")||0));
  const last=localStorage.getItem("jojoLastStudyDate");
  if(last!==today){
    streak=(last===shiftDate(today,-1))?streak+1:1;
  }

  if(window.jojoProgress && typeof window.jojoProgress.completeLesson==="function"){
    // Tracker utama memperbarui XP, streak, dan riwayat belajar sekaligus.
    const progress=window.jojoProgress.completeLesson(earned);
    total=progress && Number.isFinite(Number(progress.xp)) ? Number(progress.xp) :
      Number(localStorage.getItem("jojoXP")||localStorage.getItem("kitsumiXP")||0);
    // Jika nilainya 0, tracker tidak mencatat sesi; tetap catat hari belajar tanpa XP tambahan.
    if(earned===0){
      localStorage.setItem("jojoStreak",String(streak));
      localStorage.setItem("jojoLastStudyDate",today);
      let history={};try{history=JSON.parse(localStorage.getItem("jojoStudyHistory")||"{}")||{};}catch(e){}
      history[today]=history[today]||{lessons:0,xp:0};
      history[today].lessons+=1;
      localStorage.setItem("jojoStudyHistory",JSON.stringify(history));
    }
  }else{
    total+=earned;
    localStorage.setItem("jojoXP",String(total));
    localStorage.setItem("kitsumiXP",String(total));
    localStorage.setItem("jojoStreak",String(streak));
    localStorage.setItem("jojoLastStudyDate",today);
    let history={};try{history=JSON.parse(localStorage.getItem("jojoStudyHistory")||"{}")||{};}catch(e){}
    history[today]=history[today]||{lessons:0,xp:0};
    history[today].lessons+=1;
    history[today].xp+=earned;
    localStorage.setItem("jojoStudyHistory",JSON.stringify(history));
  }
  return {earned,total,already:false};
}

function restartTypingOnly(){
  document.getElementById("typingStage").innerHTML=`

    <div id="typingImage" class="typing-image"></div>
    <div class="typing-hint">Ketik arti kosakata ini dalam bahasa Indonesia.</div>`;
  typingIndex=0;typingCorrect=0;
  document.getElementById("typingDock").style.display="block";
  document.getElementById("typingAnswer").value="";
  document.getElementById("typingAnswer").disabled=false;
  document.getElementById("typingCheck").disabled=false;
  renderTypingCard();
}
function restartAllSessions(){
  document.getElementById("typingDock").style.display="none";
  document.body.classList.remove("typing-active");
  document.getElementById("typingStage").style.display="none";
  document.getElementById("counter").style.display="flex";
  restart();
}
document.getElementById("typingAnswer").addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    event.preventDefault();
    if(typingAnswered)nextTypingCard();
    else checkTypingAnswer();
  }
});
