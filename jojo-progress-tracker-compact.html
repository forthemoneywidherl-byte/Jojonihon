<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jojo — Belajar Bahasa Jepang</title><style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
    }
    :root {
      --navy: #12396b;
      --blue: #2f7ff0;
      --blue-light: #eef6ff;
      --muted: #91a0b3;
      --pink: #e95775;
      --green: #16b86a;
      --purple: #7d45ed;
      --yellow: #ffd52f;
      --bg: #fbf9ff;
      --red: #f05b78;
      --yellow: #ffc83d;
    }
    body {
      background:
        radial-gradient(circle at 8% 18%, rgba(125,69,237,.09), transparent 24%),
        radial-gradient(circle at 92% 34%, rgba(240,91,120,.08), transparent 22%),
        radial-gradient(circle at 12% 78%, rgba(22,184,106,.07), transparent 23%),
        var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
    }
    /* HEADER */
    header {
      height: 82px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }
    .logo {
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--navy);
    }
    .logo .pink {
      color: var(--pink);
    }
    .bell {
      border: 0;
      background: transparent;
      font-size: 36px;
      cursor: pointer;
      line-height: 1;
    }
    /* MAIN */
    main {
      padding: 16px 28px 92px;
    }
    /* WELCOME */
    .welcome {
      min-height: 124px;
      border-radius: 28px;
      background: linear-gradient(110deg, #eee7ff 0%, #e7f2ff 48%, #fff0f3 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 16px 24px 16px 30px;
      margin-bottom: 14px;
    }
    .welcome-text h1 {
      font-size: 35px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .welcome-text p {
      color: #7289a4;
      font-size: 20px;
    }
    .kitsu {
      width: 195px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 88px;
      filter: drop-shadow(0 5px 4px rgba(0,0,0,.08));
    }
    .kitsu img {
      width: 100%;
      height: 158px;
      object-fit: contain;
      display: block;
    }
    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    .stat {
      height: 98px;
      background: linear-gradient(135deg, #fff1f3, #ffffff 78%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 14px 22px;
      box-shadow: 0 8px 22px rgba(30, 70, 120, .07);
    }
    .stat:nth-child(2) {
      background: linear-gradient(135deg, #fff7d9, #ffffff 78%);
    }
    .stat-icon {
      font-size: 46px;
      width: 72px;
      text-align: center;
      margin-right: 12px;
    }
    .stat-label {
      color: #95a2b2;
      font-size: 19px;
      margin-bottom: 4px;
    }
    .stat-value {
      color: var(--navy);
      font-size: 28px;
      font-weight: 700;
    }
    /* START */
    .start-btn {
      width: 100%;
      height: 74px;
      border: 0;
      border-radius: 27px;
      background: linear-gradient(100deg, #7d45ed 0%, #2f7ff0 52%, #16b86a 100%);
      color: white;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(47, 127, 240, .25);
      margin-bottom: 20px;
      transition: transform .15s, box-shadow .15s;
    }
    .start-btn:active {
      transform: scale(.98);
    }
    /* MATERIAL */
    .section-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .materials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .material {
      text-decoration: none;
      color: var(--navy);
      background: white;
      min-height: 180px;
      border-radius: 25px;
      padding: 16px 8px 12px;
      text-align: center;
      box-shadow: 0 7px 20px rgba(30, 70, 120, .07);
      transition: transform .15s;
    }
    .material:nth-child(1) {
      background: linear-gradient(155deg, #d9fbea 0%, #f3fff8 100%);
      border: 1px solid #b8f0d2;
    }
    .material:nth-child(2) {
      background: linear-gradient(155deg, #dcecff 0%, #f4f9ff 100%);
      border: 1px solid #c3ddff;
    }
    .material:nth-child(3) {
      background: linear-gradient(155deg, #ffe0e8 0%, #fff5f7 100%);
      border: 1px solid #ffc3d0;
    }
    .material:active {
      transform: scale(.97);
    }
    .material-icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 9px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 47px;
    }
    .green {
      background: #ddfaed;
    }
    .blue {
      background: #e4f0ff;
    }
    .purple {
      background: #f0e7ff;
    }
    .material:nth-child(1) .material-icon {
      background: #ddfaed;
    }
    .material:nth-child(2) .material-icon {
      background: #e4f0ff;
    }
    .material:nth-child(3) .material-icon {
      background: #ffe5eb;
    }
    .material h3 {
      font-size: 23px;
      margin-bottom: 5px;
    }
    .material p {
      color: #a0a9b5;
      font-size: 14px;
      line-height: 1.2;
    }
    /* QUOTE */
    .quote {
      min-height: 120px;
      border-radius: 27px;
      background: linear-gradient(105deg, #f0e8ff 0%, #e8f4ff 48%, #fff4d8 100%);
      display: flex;
      align-items: center;
      padding: 14px 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .quote-kitsu {
      width: 120px;
      font-size: 68px;
      text-align: center;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote-kitsu img {
      width: 100%;
      max-width: 112px;
      height: 112px;
      object-fit: contain;
      display: block;
    }
    .quote-text {
      font-size: 22px;
      line-height: 1.35;
    }
    .quote-author {
      color: #7187a1;
      font-size: 19px;
      margin-top: 6px;
    }
    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(620px, 100%);
      height: 82px;
      background: rgba(255,255,255,.98);
      border-top: 1px solid #edf0f5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 100;
      box-shadow: 0 -7px 20px rgba(20, 50, 90, .06);
    }
    .nav-item {
      text-decoration: none;
      color: #a1acba;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 16px;
      font-weight: 600;
    }
    .nav-icon {
      font-size: 34px;
      line-height: 1;
    }
    .nav-active {
      color: var(--blue);
    }
    /* MOBILE */
    @media (max-width: 500px) {
      .app {
        max-width: 100%;
      }
      header {
        height: 80px;
        padding: 0 24px;
      }
      .logo {
        font-size: 42px;
      }
      .bell {
        font-size: 31px;
      }
      main {
        padding: 16px 24px 88px;
      }
      .welcome {
        min-height: 124px;
        padding: 16px 16px 16px 24px;
        border-radius: 27px;
      }
      .welcome-text h1 {
        font-size: 28px;
      }
      .welcome-text p {
        font-size: 17px;
      }
      .kitsu {
        width: 150px;
        font-size: 70px;
      }
      .kitsu img {
        height: 145px;
      }
      .stat {
        height: 96px;
        padding: 14px 17px;
      }
      .stat-icon {
        font-size: 39px;
        width: 53px;
        margin-right: 6px;
      }
      .stat-label {
        font-size: 17px;
      }
      .stat-value {
        font-size: 24px;
      }
      .start-btn {
        height: 72px;
        font-size: 26px;
        border-radius: 25px;
      }
      .section-title {
        font-size: 27px;
      }
      .materials {
        gap: 10px;
      }
      .material {
        min-height: 175px;
        border-radius: 22px;
        padding: 14px 5px;
      }
      .material-icon {
        width: 70px;
        height: 70px;
        font-size: 39px;
        border-radius: 20px;
      }
      .material h3 {
        font-size: 20px;
      }
      .material p {
        font-size: 13px;
      }
      .quote {
        min-height: 118px;
        padding: 12px;
      }
      .quote-kitsu {
        width: 102px;
        font-size: 54px;
      }
      .quote-text {
        font-size: 17px;
      }
      .quote-author {
        font-size: 14px;
      }
      .bottom-nav {
        height: 72px;
      }
      .nav-icon {
        font-size: 27px;
      }
      .nav-item {
        font-size: 13px;
      }
    }
    @media (max-width: 360px) {
      main {
        padding-left: 18px;
        padding-right: 18px;
      }
      .welcome-text h1 {
        font-size: 25px;
      }
      .welcome-text p {
        font-size: 16px;
      }
      .kitsu {
        font-size: 67px;
      }
      .stat-label {
        font-size: 14px;
      }
      .stat-value {
        font-size: 23px;
      }
      .material h3 {
        font-size: 17px;
      }
      .material p {
        font-size: 12px;
      }
    }

      .kitsu, .kitsu img { height: 138px; }
      .kitsu { width: 118px; }
      .stats { margin-top: -10px; margin-bottom: 8px; }
      .stat { height: 58px; }
      .start-btn { height: 51px; margin-bottom: 12px; }
      .material { min-height: 128px; }
      .material-icon { width: 51px; height: 52px; font-size: 31px; }
      .quote { min-height: 78px; }
      .quote-kitsu { width: 67px; }
      .quote-kitsu img { height: 70px; }
      .bottom-nav { height: 60px; }
      main { padding-bottom: 68px; }

    /* User-provided navbar assets */
    .bottom-nav {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      padding: 3px 8px 0;
    }
    .bottom-nav .nav-item {
      min-width: 0;
      height: 100%;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .nav-asset {
      display: block;
      width: 100%;
      max-width: 112px;
      height: 58px;
      object-fit: contain;
      object-position: center;
    }
    .nav-home-icon {
      display: block;
      font-size: 27px;
      line-height: 1;
      font-weight: 900;
      color: #1878e8;
      margin-bottom: 1px;

    .bottom-nav .nav-active {
      color: #1878e8;
    }
    @media (max-width: 500px) {
      .nav-asset { height: 53px; }
      .nav-home-icon { font-size: 25px; }
    }
    /* Complete four-item navbar assets supplied by the user */
    .bottom-nav {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      padding: 4px 8px;
      background: rgba(255,255,255,.98);
      border-radius: 27px 27px 0 0;
    }
    .bottom-nav .nav-item {
      width: 100%;
      height: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      text-decoration: none;
      overflow: hidden;
    }
    .nav-asset-complete {
      display: block;
      width: min(100%, 116px);
      height: 64px;
      object-fit: contain;
      object-position: center;
    }
    .bottom-nav .nav-active {

    /* Rounded Nunito typography for Jojo */
    html, body, button, input, select, textarea {
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
    }
    .logo, .welcome-text h1, .section-title, .material h3,
    .start-btn, .stat-value, .quote-text, .nav-item {
      font-weight: 800;

    /* Stronger, fuller typography across the whole interface */
    html, body, button, input, select, textarea {
      font-family: 'Nunito', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body { font-weight: 700; }
    .logo,
    .welcome-text h1,

    .material h3,

    .stat-value,
    .quote-text,
    .nav-item,

    .material-image-card {
      display: block;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 0 !important;
      border-radius: 25px;
      background: transparent !important;
      box-shadow: 0 7px 13px rgba(44, 71, 130, .12);
      line-height: 0;
    }
    .material-image-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 473 / 669;
      object-fit: cover;

    .material-image-card:active {

    @media (max-width: 500px) {

        border-radius: 19px;

    function mulaiBelajar() {
      window.location.href = "kosakata.html";
    }
    // JOJO progress tracker: XP and streak are saved on this device.
    (function () {
      const XP_KEY = "jojoXP";
      const LEGACY_XP_KEY = "kitsumiXP";
      const STREAK_KEY = "jojoStreak";
      const LAST_STUDY_KEY = "jojoLastStudyDate";
      const HISTORY_KEY = "jojoStudyHistory";
      function localDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function shiftDate(dateKey, amount) {
        const parts = dateKey.split("-").map(Number);
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        date.setDate(date.getDate() + amount);
        return localDateKey(date);
      }
      function readHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY) || "{}");
        } catch (error) {
          return {};
        }
      }
      function getXP() {
        const stored = localStorage.getItem(XP_KEY);
        if (stored !== null && Number.isFinite(Number(stored))) return Math.max(0, Number(stored));
        const legacy = localStorage.getItem(LEGACY_XP_KEY);
        if (legacy !== null && Number.isFinite(Number(legacy))) return Math.max(0, Number(legacy));
        // Keep the existing displayed XP as the starting balance (currently 120).
        const displayed = Number(document.getElementById("xp")?.textContent || 120);
        return Number.isFinite(displayed) ? Math.max(0, displayed) : 120;
      }
      function getCurrentStreak() {
        const lastDate = localStorage.getItem(LAST_STUDY_KEY);
        const streak = Math.max(0, Number(localStorage.getItem(STREAK_KEY) || 0));
        if (!lastDate) return 0;
        const today = localDateKey(new Date());
        const yesterday = shiftDate(today, -1);
        if (lastDate === today || lastDate === yesterday) return streak;
        return 0;
      }
      function render() {
        const xpEl = document.getElementById("xp");
        const streakEl = document.getElementById("streak");
        if (xpEl) xpEl.textContent = String(getXP());
        if (streakEl) streakEl.textContent = String(getCurrentStreak());
        // Keep the legacy XP key in sync for any older JOJO/Kitsumi pages.
        localStorage.setItem(LEGACY_XP_KEY, String(getXP()));
      }
      function completeLesson(points) {
        const earned = Math.max(0, Math.floor(Number(points) || 0));
        if (earned <= 0) return getProgress();
        const today = localDateKey(new Date());
        const lastDate = localStorage.getItem(LAST_STUDY_KEY);
        let streak = Math.max(0, Number(localStorage.getItem(STREAK_KEY) || 0));
        if (lastDate !== today) {
          if (lastDate === shiftDate(today, -1)) {
            streak += 1;
          } else {
            streak = 1;
          }
        }
        const totalXP = getXP() + earned;
        const history = readHistory();
        const day = history[today] || { lessons: 0, xp: 0 };
        day.lessons += 1;
        day.xp += earned;
        history[today] = day;
        localStorage.setItem(XP_KEY, String(totalXP));
        localStorage.setItem(LEGACY_XP_KEY, String(totalXP));
        localStorage.setItem(STREAK_KEY, String(streak));
        localStorage.setItem(LAST_STUDY_KEY, today);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        render();
        window.dispatchEvent(new CustomEvent("jojo:progress-updated", {
          detail: { xp: totalXP, streak, earned, date: today, daily: day }
        }));
        return getProgress();
      }
      function getProgress() {
        return {
          xp: getXP(),
          streak: getCurrentStreak(),
          lastStudyDate: localStorage.getItem(LAST_STUDY_KEY),
          history: readHistory()
        };
      }
      // Other pages call this after a lesson/quiz is successfully completed.
      window.jojoProgress = {
        completeLesson,
        getProgress,
        refresh: render
      };
      // Optional event integration for pages that prefer dispatching an event.
      window.addEventListener("jojo:lesson-completed", function (event) {
        const points = event.detail && event.detail.xp !== undefined ? event.detail.xp : 10;
        completeLesson(points);
      });
      window.addEventListener("storage", function (event) {
        if ([XP_KEY, LEGACY_XP_KEY, STREAK_KEY, LAST_STUDY_KEY, HISTORY_KEY].includes(event.key)) {
          render();
        }
      });
      render();
    })();
  </script></body>
