<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<title>JOJO — Kotoba N5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1b356d;--muted:#71839d;--blue:#3285ee;--pale:#eef5ff}
html,body{min-height:100%;background:linear-gradient(180deg,#eaf4ff 0%,#f4f3ff 100%);color:var(--navy)}
body{font-family:'Nunito',sans-serif}
.app{width:100%;max-width:620px;min-height:100dvh;margin:0 auto;padding-bottom:90px;display:flex;flex-direction:column}
header{height:126px;flex:0 0 126px;display:flex;align-items:center;justify-content:space-between;padding:20px 28px 12px;background:transparent}
.brand{font-size:58px;line-height:1;font-weight:1000;letter-spacing:-4px;color:#1c356e;text-decoration:none}
.brand span{color:#1c356e}
.back{order:2;width:62px;height:62px;border-radius:22px;background:#fff;color:#3285ee;display:grid;place-items:center;text-decoration:none;font-size:36px;font-weight:900;box-shadow:0 5px 16px #244b8012}
.header-tag{display:none}
main{padding:12px 28px 28px;flex:1}
.hero{background:linear-gradient(110deg,#e6ddff 0%,#e4efff 52%,#ffe8ef 100%);border-radius:27px;padding:25px 28px;margin-bottom:24px;box-shadow:0 9px 22px #455d9910}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#7788a5}
h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:30px;line-height:1.2;margin:4px 0 8px;color:#203a76}
.hero p{font-size:15px;line-height:1.55;font-weight:800;color:#71829d}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{background:#ffffffb8;color:#526f9e;border-radius:12px;padding:7px 11px;font-size:11px;font-weight:900}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}
.section-head h2{font-size:22px;font-weight:1000;color:#203a76}
.section-head span{font-size:12px;color:#8190a8;font-weight:900}
.search{width:100%;border:1px solid #e7edf7;background:#fff;border-radius:17px;padding:15px 17px;font:800 14px 'Nunito';color:var(--navy);outline:none;margin-bottom:14px;box-shadow:0 5px 14px #344f7909}
.search:focus{border-color:#8bb9f4;box-shadow:0 0 0 3px #8bb9f426}
.chapter-list{display:grid;gap:12px}
.chapter{background:#fff;border:1px solid #ffffff;border-radius:23px;overflow:hidden;box-shadow:0 7px 20px #425d8710}
.chapter-toggle{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 17px;cursor:pointer;color:inherit;min-height:92px}
.chapter-number{flex:0 0 72px;height:72px;border-radius:22px;background:#20b978;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:1000;box-shadow:inset 0 -5px #00000010}
.chapter:nth-child(5n+2) .chapter-number{background:#3487e9}
.chapter:nth-child(5n+3) .chapter-number{background:#8555e7}
.chapter:nth-child(5n+4) .chapter-number{background:#e85b7d}
.chapter:nth-child(5n+5) .chapter-number{background:#e9ad22}
.chapter-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.chapter-copy strong{font-size:17px;font-weight:1000;line-height:1.25;color:#20396f}
.chapter-copy small{font-size:12px;color:#71839d;font-weight:800;line-height:1.35}
.chapter-toggle[aria-expanded="true"] .chapter-detail{padding:0 18px 17px 103px;color:#71849f;font-size:13px;font-weight:800}
.status{display:inline-block;margin-top:8px;background:#fff2d9;color:#a87513;border-radius:10px;padding:6px 10px;font-size:10px;font-weight:1000}
.empty{display:none;text-align:center;padding:25px;color:var(--muted);font-weight:900}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);height:82px;background:rgba(255,255,255,.98);border-top:1px solid #edf0f5;display:grid;grid-template-columns:repeat(4,1fr);z-index:100;box-shadow:0 -7px 20px rgba(20,50,90,.06);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{text-decoration:none;color:#a1acba;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800}
.nav-asset{display:block;width:100%;max-width:112px;height:58px;object-fit:contain;object-position:center}
.nav-active{color:#a1acba}
@media(max-width:500px){
 header{height:126px;flex-basis:126px;padding:20px 28px 10px}
 .brand{font-size:58px}
 main{padding:12px 28px 26px}
 .hero{padding:25px 28px;margin-bottom:24px}
 .chapter-toggle{padding:15px 15px;min-height:88px;gap:13px}
 .chapter-number{flex-basis:72px;height:72px}
 .chapter-copy strong{font-size:16px}
 .chapter-copy small{font-size:11px}
 .chapter-detail{padding-left:100px}
}

.brand { display:flex; align-items:center; width:220px; height:82px; text-decoration:none; }
.brand-logo { display:block; width:220px; height:auto; object-fit:contain; object-position:left center; }
@media(max-width:500px) {
 .brand { width:220px; height:82px; }
 .brand-logo { width:220px; }
}
\n.chapter-link{display:flex;text-decoration:none;color:inherit}.chapter-link:active{background:#f5f9ff}

.chapter-link,
.chapter-link:link,
.chapter-link:visited,
.chapter-link:hover,
.chapter-link:active,
.chapter-link:focus {
 text-decoration: none !important;
 color: inherit;
}
.chapter-link .chapter-copy,
.chapter-link .chapter-copy strong,
.chapter-link .chapter-copy small {
 text-decoration: none !important;
}


.chapter-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chapter{min-width:0;background:transparent;border:0;border-radius:20px;overflow:hidden;box-shadow:none}
.chapter-art-link{display:block;width:100%;line-height:0;border-radius:20px;overflow:hidden;text-decoration:none!important;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.chapter-art-link:active{transform:scale(.97)}
.chapter-art{display:block;width:100%;height:auto;aspect-ratio:1.30/1;object-fit:cover}
@media(max-width:500px){.chapter-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chapter-art-link{border-radius:17px}}
</style>
</head>

<script>
document.querySelectorAll('.chapter-toggle').forEach(button=>{
 button.addEventListener('click',()=>{
 const open=button.getAttribute('aria-expanded')==='true';
 button.setAttribute('aria-expanded',String(!open));
 const panel=document.getElementById(button.getAttribute('aria-controls'));
 panel.hidden=open;
 });
});
const search=document.getElementById('chapterSearch');
search.addEventListener('input',()=>{
 const q=search.value.trim().toLocaleLowerCase('id');
 let visible=0;
 document.querySelectorAll('.chapter').forEach(card=>{
 const show=card.dataset.search.includes(q);
 card.hidden=!show;
 if(show) visible++;
 });
 document.getElementById('emptyState').style.display=visible?'none':'block';
});
</script>
